name: Mutation

on:
  pull_request:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find changed source files
        id: changed
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/*.ts' ':!src/*.test.ts' | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed: ${files:-none}"

      - name: Mutate changed files
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: npx stryker run --mutate "${{ steps.changed.outputs.files }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutation
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
